services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - codeproof-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    build: ./server
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/codeproof
      FRONTEND_URL: http://localhost:5173
      EXECUTION_MODE: docker
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  codeproof-mongo:
